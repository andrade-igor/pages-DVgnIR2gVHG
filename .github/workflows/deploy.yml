name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Include static pages in artifact
        run: |
          mkdir -p dist/assets
          cp -f DSX2026.html dist/DSX2026.html
          cp -rf assets/* dist/assets/
          for f in *.html; do [ "$f" != "DSX2026.html" ] && cp -f "$f" dist/ || true; done
          for d in *-img morada-cafe-briefing dsx-2026-lp-vendas; do [ -d "$d" ] && cp -rf "$d" dist/ || true; done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
